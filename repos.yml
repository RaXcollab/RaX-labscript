# RaX labscript suite - backend repository manifest
#
# The labscript suite is this parent repo plus the three backend forks below.
# Nothing else belongs here: the external GUI applications under GUIs/ are
# separate programs with their own repos, environments, and install steps.
#
# `pinned` is the commit bootstrap.ps1 checks out by default, giving a fresh
# machine the same backend versions this parent commit was developed against.
# `branch` is the branch that commit lives on, for `-Latest` mode and for
# returning to normal development after a pinned checkout.
#
# To re-pin after validating a new backend state, run:  .\bootstrap.ps1 -UpdatePins
# Commit the result together with the parent change that depends on it.

