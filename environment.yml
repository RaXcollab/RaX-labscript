# Direct conda specification for the RaX labscript environment.
# Status: provisional until the clean-machine and lab control computer checks pass.
# Last reviewed: 2026-08-21.
#
# The stock meta-package supplies the common suite components. bootstrap.ps1
# then installs the three pinned RaX backends as editable packages.
#
# pyzmq 25.1.0 is the current candidate. Do not change it before lab computer
# validation. NumPy stays below 2.0 for the current Nuvu worker.

name: labscript-rax

channels:
  - defaults
  - conda-forge
  - labscript-suite

dependencies:
  - python=3.11.14
  - pip
  - setuptools>=64
  - setuptools-scm>=8
  - wheel
  - pytest

  # labscript suite (unforked components come from the channel)
  - labscript=3.4.0
  - labscript-suite=3.3.0
  - labscript-c-extensions=1.2.1

  # Compatibility pins. Verify them on the lab computer before changes.
  - numpy=1.26.4
  - pyzmq=25.1.0

  # runtime dependencies of the suite
  - h5py=3.15.1
  - pyqt=5.15.11
  - pyqtgraph=0.13.7
  - zprocess=2.27.0
  - pyvisa=1.15.0
  - matplotlib
  - scipy
  - pandas
  - ipywidgets

  # NI-SCOPE Python API. The NI-SCOPE system driver is also required.
  - pip:
      - niscope
